<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AgenticBridge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>AgenticBridge</h1>
    <span id="status-dot" class="dot"></span>
  </header>

  <main>
    <section id="task-panel">
      <h2>Task</h2>
      <textarea id="task-input" rows="3" placeholder="Describe what the agents should build..."></textarea>
      <button id="save-task">Save task</button>
    </section>

    <section id="controls-panel">
      <h2>Take a turn</h2>
      <div id="agent-buttons">
        {% for agent in agents %}
        <button class="agent-btn" data-agent="{{ agent.name }}">
          {{ agent.name }} <small>({{ agent.provider }}/{{ agent.model }})</small>
        </button>
        {% endfor %}
        <button id="auto-btn" class="agent-btn">Next in queue</button>
      </div>
      <p id="turn-status"></p>
    </section>

    <div id="columns">
      <section id="ledger-panel">
        <h2>Ledger</h2>
        <div id="ledger-entries"></div>
      </section>

      <section id="files-panel">
        <h2>Workspace</h2>
        <pre id="file-tree"></pre>
        <h3>File viewer</h3>
        <pre id="file-view">(click a file path in the ledger to view it)</pre>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
