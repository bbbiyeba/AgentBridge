<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentBridge</title>

    <!--
      description, og:title, og:description, og:image, twitter:card, and
      twitter:image are injected at build time by the figmaSiteConfiguration
      plugin (vite.config.ts) from .figma/make/site.json -- do NOT add them
      here too, or crawlers see duplicate/conflicting tags (this broke
      LinkedIn's link preview once already). Only add tags here that plugin
      doesn't cover:
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentbridge-site-pi.vercel.app/" />
    <meta name="twitter:title" content="AgentBridge" />
    <meta name="twitter:description" content="Multiple AI agents, one codebase. Claude, ChatGPT, and local Ollama models take turns working on a shared workspace." />
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
